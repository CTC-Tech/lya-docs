            application/json:
              schema:
                $ref: "#/components/schemas/RetrievePatientSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    patch:
      tags: *lya_health_api
      summary: Update Patient
      operationId: update_organization_patient
      security:
        - HTTPBearer: []
      parameters:
        - name: patient_uuid
          in: path
          required: true
          schema:
            type: string
            title: Patient Uuid
        - name: organization_identifier_value
          in: path
          required: true
          schema:
            anyOf:
              - type: string
              - type: integer
            title: Identifier Value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientSchema"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievePatientSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    delete:
      tags: *lya_health_api
      summary: Delete Patient
      operationId: delete_organization_patient
      security:
        - HTTPBearer: []
      parameters:
        - name: patient_uuid
          in: path
          required: true
          schema:
            type: string
            title: Patient Uuid
        - name: organization_identifier_value
          in: path
          required: true
          schema:
            anyOf:
              - type: string
              - type: integer
            title: Identifier Value
      responses:
        "204":
          description: Successful Response
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /integration/api/v2/organizations/{organization_identifier_value}/patients/external/{metadata_external_id}/:
    get:
      tags: *lya_health_api
      summary: Retrieve Patient by External ID
      operationId: retrieve_organization_patient_external_id
      description: Busca um paciente pelo seu `metadata_external_id` (ID do sistema legado).
      security:
        - HTTPBearer: []
      parameters:
        - name: organization_identifier_value
          in: path
          required: true
          schema:
            anyOf:
              - type: string
              - type: integer
            title: Identifier Value
        - name: metadata_external_id
          in: path
          required: true
          schema:
            type: string
            title: Metadata External Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievePatientSchema"
        "404":
          description: Paciente não encontrado
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

  /integration/api/v2/organizations/{organization_identifier_value}/patients/bulk/:
    parameters:
      - name: organization_identifier_value
        in: path
        required: true
        schema:
          anyOf:
            - type: string
            - type: integer
          title: Identifier Value
    post:
      tags:
        - Lya Health API — Operações em Lote
      summary: Bulk Create Patients
      operationId: create_current_organization_patients_bulk
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/CreateOrganizationPatientSchema"
              minItems: 1
              maxItems: 300
      responses:
        "201":
          description: Lista de resultados individuais por paciente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BulkCreatePatientResponseItem"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    patch:
      tags:
        - Lya Health API — Operações em Lote
      summary: Bulk Update Patients
      operationId: update_organization_patients_bulk
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/UpdatePatientBulkItemSchema"
              minItems: 1
              maxItems: 300
      responses:
        "200":
          description: Lista de resultados individuais por paciente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BulkUpdatePatientResponseItem"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    delete:
      tags:
        - Lya Health API — Operações em Lote
      summary: Bulk Delete Patients
      operationId: delete_organization_patients_bulk
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/DeletePatientBulkItemSchema"
              minItems: 1
              maxItems: 300
      responses:
        "200":
          description: Lista de resultados individuais por paciente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BulkDeletePatientResponseItem"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

