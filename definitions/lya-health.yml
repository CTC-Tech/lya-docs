          type: object
          properties:
            cognitoIdentityPoolId:
              type: string
              nullable: true
              example: null
            accountId:
              type: string
              nullable: true
              example: null
            cognitoIdentityId:
              type: string
              nullable: true
              example: null
            caller:
              type: string
              nullable: true
              example: null
            sourceIp:
              type: string
              example: "192.168.1.1"
            principalOrgId:
              type: string
              nullable: true
              example: null
            accessKey:
              type: string
              nullable: true
              example: null
            cognitoAuthenticationType:
              type: string
              nullable: true
              example: null
            cognitoAuthenticationProvider:
              type: string
              nullable: true
              example: null
            userArn:
              type: string
              nullable: true
              example: null
            userAgent:
              type: string
              example: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
            user:
              type: string
              nullable: true
              example: null
        domainName:
          type: string
          example: "api.example.com"
        deploymentId:
          type: string
          example: "deploy-xyz"
        apiId:
          type: string
          example: "api-123456"
