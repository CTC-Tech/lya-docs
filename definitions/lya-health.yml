openapi: 3.1.0
info:
  title: Lya Health API
  description: Lya Health API Service
  version: "2.0"

servers:
  - url: https://api.lya-health-hml.ctctech.link
    description: Servidor de Homologação
  - url: https://api.lyahealth.com.br
    description: Servidor de Produção

tags:
  - name: Lya Tenants
    description: Validação de acesso e autenticação de tenants.
  - name: Lya Patients
    description: Configuração dos repositórios FHIR e adaptadores de autenticação usados pela Lya para buscar dados dos pacientes.
  - name: Lya Health API
    description: Gerenciamento de pacientes, resources FHIR, credenciais de tenant e sessões. Use para operações em registros individuais.
  - name: Lya Health API — Operações em Lote
    description: Criação, atualização e remoção de até 300 registros por requisição. Cada item é processado de forma independente.

paths:
  /tenants/validate/:
    get:
      tags:
        - Lya Tenants
      summary: Validate Tenant
      operationId: validate_tenant
      security:
        - HTTPBearer: []
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateTenantSchema"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateTenantUnauthorizedErrorSchema"

  /patients/v1/auth/me/:
    get:
      tags: &lya_patients
        - Lya Patients
      summary: Lya Patients Validate Token
      operationId: patients_validate_token
      security:
        - HTTPBearer: []
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAuthorizationSchema"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateTenantUnauthorizedErrorSchema"
  /patients/v1/repositories/:
    get:
      tags: *lya_patients
      summary: Get Repositories
      security:
        - HTTPBearer: []
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRepositorySchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    post:
      tags: *lya_patients
      summary: Create Repositories
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepositorySchema"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveRepositorySchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /patients/v1/repositories/{uuid}/:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          title: Repository UUID
          type: string
    get:
      tags: *lya_patients
      summary: Retrieve Repository
      security:
        - HTTPBearer: []
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveRepositorySchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    patch:
      tags: *lya_patients
      summary: Update Repository
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRepositorySchema"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveRepositorySchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    delete:
      tags: *lya_patients
      summary: Delete Repository
      security:
        - HTTPBearer: []
      responses:
        "204":
          description: Successful Response

  /integration/api/v2/actors/current/:
    get:
      tags: &lya_health_api
        - Lya Health API
      summary: Current Actor
      operationId: actors_current
      security:
        - HTTPBearer: []
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantActorSchema"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateTenantUnauthorizedErrorSchema"
  /integration/api/v2/organizations/{organization_identifier_value}/patients/:
    get:
      tags: *lya_health_api
      summary: List Patients
      operationId: list_organization_patients
      security:
        - HTTPBearer: []
      parameters:
        - name: organization_identifier_value
          in: path
          required: true
          schema:
            anyOf:
              - type: string
              - type: integer
            title: Identifier Value
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            description: Page number
            default: 1
            title: Page
          description: Page number
        - name: size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: Page size
            default: 50
            title: Size
          description: Page size
        - name: query
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Query
        - name: order_by
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Order By
        - name: uuid
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: "null"
            title: Uuid
        - name: name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Name
        - name: document
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Document
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPatientSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    post:
      tags: *lya_health_api
      summary: Create Patient
      operationId: create_organization_patient
      security:
        - HTTPBearer: []
      parameters:
        - name: organization_identifier_value
          in: path
          required: true
          schema:
            anyOf:
              - type: string
              - type: integer
            title: Identifier Value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationPatientSchema"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievePatientSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  ? /integration/api/v2/organizations/{organization_identifier_value}/patients/{patient_uuid}/
  : get:
      tags: *lya_health_api
      summary: Retrieve Patient
      operationId: retrieve_organization_patient
      security:
        - HTTPBearer: []
      parameters:
        - name: patient_uuid
          in: path
