components:
  schemas:
    HttpAdapterSchema:
      properties:
        adapter_type:
          const: http
          default: http
          type: string
          title: Adapter Type
        url_template:
          type: string
          title: URL Template
        query_mapping:
          type: object
          title: Query Mapping
      type: object
      title: HttpAdapterSchema
    HttpBearerAdapterSchema:
      properties:
        adapter_type:
          const: http_bearer
          default: http_bearer
          type: string
          title: Adapter Type
        url_template:
          type: string
          title: URL Template
        query_mapping:
          type: object
          title: Query Mapping
        token:
          type: string
          title: Token
      type: object
      title: HttpBearerAdapterSchema
    HttpOAuth2AdapterSchema:
      properties:
        adapter_type:
          const: http_oauth2
          default: http_oauth2
          type: string
          title: Adapter Type
        url_template:
          type: string
          title: URL Template
        query_mapping:
          type: object
          title: Query Mapping
        client_id:
          type: string
          title: Client ID
        client_secret:
          type: string
          title: Client Secret
        token_url:
          type: string
          title: Token URL
        scope:
          items:
            type: string
          type: array
          title: Token URL
      type: object
      title: HttpOAuth2AdapterSchema
    CreateRepositorySchema:
      properties:
        adapter:
          type: object
          title: Adapter
          oneOf:
            - $ref: "#/components/schemas/HttpAdapterSchema"
            - $ref: "#/components/schemas/HttpBearerAdapterSchema"
            - $ref: "#/components/schemas/HttpOAuth2AdapterSchema"
      type: object
      title: CreateRepositorySchema
    UpdateRepositorySchema:
      properties:
        adapter:
          type: object
          title: Adapter
          oneOf:
            - $ref: "#/components/schemas/HttpAdapterSchema"
            - $ref: "#/components/schemas/HttpBearerAdapterSchema"
            - $ref: "#/components/schemas/HttpOAuth2AdapterSchema"
      type: object
      title: UpdateRepositorySchema
    RetrieveRepositorySchema:
      properties:
        uuid:
          type: string
          title: Tenant Slug
        tenant_slug:
          type: string
          title: Tenant Slug
        adapter:
          type: object
          title: Adapter
          oneOf:
            - $ref: "#/components/schemas/HttpAdapterSchema"
            - $ref: "#/components/schemas/HttpBearerAdapterSchema"
            - $ref: "#/components/schemas/HttpOAuth2AdapterSchema"
      type: object
      title: RetrieveRepositorySchema
    ListRepositorySchema:
      properties:
        items:
          items:
            $ref: "#/components/schemas/RetrieveRepositorySchema"
          type: array
          title: Items
    CreatePatientSchema:
      properties:
        name:
          type: string
          title: Name
        document:
          anyOf:
            - type: string
            - type: "null"
          title: Document
        document_type:
          anyOf:
            - $ref: "#/components/schemas/PatientDocumentTypeEnum"
            - type: "null"
        metadata_external_id:
          anyOf:
            - type: string
            - type: "null"
          title: Metadata External Id
        sector:
          anyOf:
            - type: string
            - type: "null"
          title: Sector
        external_sector_id:
          anyOf:
            - type: string
            - type: "null"
          title: External Sector ID
        phone_number:
          anyOf:
            - type: string
            - type: "null"
          title: Phone Number
        birth:
          anyOf:
            - type: string
              format: date
            - type: "null"
          title: Birth
        height:
          anyOf:
            - type: integer
            - type: "null"
          example: 170
          title: Height (cm)
        weight:
          anyOf:
            - type: number
              format: float
            - type: "null"
          example: 72.5
          title: Weight (kg)
        is_integration:
          type: boolean
          default: true
          title: Is Integration
        consultation_code:
          anyOf:
            - type: string
            - type: "null"
          title: Consultation Code
        consultation_date:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Consultation Date
        filters:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/CreatePatientFilterSchema"
            - type: "null"
          title: Filters
      type: object
      required:
        - name
      title: CreatePatientSchema
    CreateOrganizationPatientSchema:
      description: Schema usado pela integração. Os campos document, document_type, metadata_external_id e birth são obrigatórios.
      allOf:
        - $ref: "#/components/schemas/CreatePatientSchema"
        - type: object
          required:
            - name
            - document
            - document_type
            - metadata_external_id
            - birth
          properties:
            document:
              type: string
              title: Document
            document_type:
              $ref: "#/components/schemas/PatientDocumentTypeEnum"
            metadata_external_id:
              type: string
              title: Metadata External Id
            birth:
              type: string
              format: date
              title: Birth
      title: CreateOrganizationPatientSchema
    CreatePatientProcedureSchema:
      properties:
        surgery_code:
          anyOf:
            - type: string
            - type: "null"
          title: Surgery Code
        surgery_description:
          type: string
          title: Surgery Description
        is_primary:
          type: boolean
          default: false
          title: Is Primary
      type: object
      required:
        - surgery_description
      title: CreatePatientProcedureSchema
    CreatePatientFilterValueSchema:
      properties:
        value:
          type: string
          title: Value
        title:
          type: string
          title: Title
        procedures:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/CreatePatientProcedureSchema"
            - type: "null"
          title: Procedures
      type: object
      required:
        - value
        - title
      title: CreatePatientFilterValueSchema
    CreatePatientFilterSchema:
      properties:
        name:
          type: string
          title: Name
        query_parameter:
          type: string
          title: Query Parameter
        values:
          type: array
          items:
            $ref: "#/components/schemas/CreatePatientFilterValueSchema"
          title: Values
      type: object
      required:
        - name
        - query_parameter
        - values
      title: CreatePatientFilterSchema
    PatientProcedureSchema:
      properties:
        id:
          type: integer
          title: Id
        surgery_code:
          anyOf:
            - type: string
            - type: "null"
          title: Surgery Code
        surgery_description:
          type: string
          title: Surgery Description
        is_primary:
          type: boolean
          title: Is Primary
      type: object
      required:
        - id
        - surgery_description
        - is_primary
      title: PatientProcedureSchema
    RetrievePatientFilterValueSchema:
      properties:
        id:
          type: integer
          title: Id
        value:
          type: string
          title: Value
        title:
          type: string
          title: Title
        procedures:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/PatientProcedureSchema"
            - type: "null"
          title: Procedures
      type: object
      required:
        - id
        - value
        - title
      title: RetrievePatientFilterValueSchema
    RetrievePatientFilterSchema:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        slug:
          type: string
          title: Slug
        query_parameter:
          type: string
          title: Query Parameter
        values:
          type: array
          items:
            $ref: "#/components/schemas/RetrievePatientFilterValueSchema"
          title: Values
      type: object
      required:
        - id
        - name
        - slug
        - query_parameter
        - values
      title: RetrievePatientFilterSchema
    PatientSessionSummarySchema:
      properties:
        id:
          type: integer
          title: Id
        name:
          anyOf:
            - type: string
            - type: "null"
          title: Name
        created_at:
          type: string
          format: date-time
          title: Created At
        finished_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Finished At
        assistant_id:
          type: integer
          title: Assistant Id
      type: object
      required:
        - id
        - created_at
        - assistant_id
      title: PatientSessionSummarySchema
    CreatePatientResourcesSchema:
      properties:
        url:
          type: string
          title: Url
      type: object
      required:
        - url
      title: CreatePatientResourcesSchema
    CreateTenantCredentialSchema:
      properties:
        host:
          type: string
          title: Host
        tenant_slug:
          type: string
          title: Tenant Slug
        secret_key:
          type: string
          title: Secret Key
      type: object
      required:
        - host
        - tenant_slug
        - secret_key
      title: CreateTenantCredentialSchema
    ListPatientItemSchema:
      description: Extensão de RetrievePatientSchema com campos de última sessão, retornada no GET list.
      allOf:
        - $ref: "#/components/schemas/RetrievePatientSchema"
        - type: object
          properties:
            last_session_id:
              anyOf:
                - type: integer
                - type: "null"
              title: Last Session Id
            last_session_created_at:
              anyOf:
                - type: string
                  format: date-time
                - type: "null"
              title: Last Session Created At
      title: ListPatientItemSchema
    ListPatientSchema:
      properties:
        items:
          items:
            $ref: "#/components/schemas/ListPatientItemSchema"
          type: array
          title: Items
        total:
          anyOf:
            - type: integer
              example: 1
          title: Total
        page:
          anyOf:
